<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0c1210">
    <title>Digi Pocketeers</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="js/core/hub.js"></script>
    <script>
        // The host app serves every file off this phone, so a cache there is
        // pure liability - and a worker registered on this origin by an older
        // build would answer from it. Registering is for the public web build
        // only; sw.js removes itself if it ever wakes on a host-app origin,
        // because an index.html this old cannot be trusted to do it.
        if ('serviceWorker' in navigator && !window.POCKETEERS_PUBLIC_ORIGIN) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
